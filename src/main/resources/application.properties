# Local development settings. Real environment variables take priority over this file.
spring.config.import=optional:file:.env.local[.properties]

lastfm.api-key=${LASTFM_API_KEY:}

# Error alerts through Sentry. Off unless SENTRY_DSN is set. IP addresses and headers are not sent.
sentry.dsn=${SENTRY_DSN:}
sentry.send-default-pii=false

spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:h2:file:///./data/musicfinder;DB_CLOSE_DELAY=-1}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:sa}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:}

spring.sql.init.mode=always

# Close database connections soon after use so a scale-to-zero database (such as Neon's
# free plan, which sleeps after 5 idle minutes) is not kept awake by an idle pool.
spring.r2dbc.pool.initial-size=1
spring.r2dbc.pool.max-idle-time=2m